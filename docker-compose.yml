# Production on one server: the app, its Postgres and Caddy (automatic https).
# Secrets live in deploy/.env next to this file (not in git) — see deploy/env.example.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: darksky
      POSTGRES_DB: darksky
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in deploy/.env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darksky -d darksky"]
      interval: 5s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    env_file: deploy/.env
    environment:
      DATABASE_URL: postgres://darksky:${DB_PASSWORD}@db:5432/darksky?sslmode=disable
      SITE_URL: https://${SITE_HOST}
    # the files of every build (see Dockerfile), so pages cached before a deploy keep working
    volumes: [next-static:/app/.next/static]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in deploy/.env}
      SITE_OLD: ${SITE_OLD:?set SITE_OLD in deploy/.env (previous address, redirected)}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]

volumes:
  pgdata:
  next-static:
  caddy_data:
  caddy_config:
